name: Publicar site

# Gera o site (node build.mjs) e publica a pasta publico/ na branch gh-pages (GitHub Pages).
# Todo dia, depois do robô do just-burger-producao (06:17), traz antes o cardápio,
# as fotos tratadas e a nota do iFood (importar-cardapio.py). Sem dado novo, publica o que já tem.
on:
  push:
    branches: [main]
  schedule:
    - cron: '47 9 * * *'   # 06:47 em São Paulo
  workflow_dispatch:

permissions:
  contents: write   # publica o site pronto na branch gh-pages

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cardápio e fotos do iFood (via robô do Hub)
        continue-on-error: true
        run: |
          pip install --quiet pillow
          python3 importar-cardapio.py

      - name: Gerar o site
        run: node build.mjs

      # O GitHub Pages serve a branch gh-pages (Settings → Pages → Source: Deploy from a branch, gh-pages).
      - name: Publicar na branch gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd publico
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="Robo Site Just Burger" -c user.email="robo@justburger.com.br" commit -q -m "Site gerado de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
