name: Publicar site

# Gera o site (node build.mjs) e publica a pasta publico/ direto no GitHub Pages pela fila do GitHub Actions
# (Settings → Pages → Source: GitHub Actions). Um passo só, sem a branch gh-pages: a publicação mais nova
# substitui a que estiver esperando, e não trava mais uma na outra (Maikon 01/11).
# Todo dia, depois do robô do just-burger-producao (06:17), traz antes o cardápio,
# as fotos tratadas e a nota do iFood (importar-cardapio.py). Sem dado novo, publica o que já tem.
on:
  push:
    branches: [main]
  schedule:
    - cron: '47 9 * * *'   # 06:47 em São Paulo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cardápio e fotos do iFood (via robô do Hub)
        continue-on-error: true
        run: |
          pip install --quiet pillow
          python3 importar-cardapio.py

      - name: Gerar o site
        run: |
          node build.mjs
          touch publico/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publico

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

      # Avisa o Bing (e o que usa IndexNow) que as páginas do sitemap mudaram. Falha aqui não derruba a publicação.
      - name: Avisar buscadores (IndexNow)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          site = 'https://www.justburger.com.br'
          xml = urllib.request.urlopen(site + '/sitemap.xml', timeout=30).read().decode()
          urls = re.findall(r'<loc>([^<]+)</loc>', xml)[:10000]
          corpo = json.dumps({'host': 'www.justburger.com.br', 'key': '391da1ef68624950f4886cb22a3fc978', 'keyLocation': site + '/391da1ef68624950f4886cb22a3fc978.txt', 'urlList': urls}).encode()
          req = urllib.request.Request('https://api.indexnow.org/indexnow', data=corpo, headers={'Content-Type': 'application/json; charset=utf-8'})
          print('IndexNow:', urllib.request.urlopen(req, timeout=30).status, len(urls), 'páginas')
          PY
